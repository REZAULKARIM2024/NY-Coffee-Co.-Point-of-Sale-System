# JUnit 5 parallel execution — attempted, measured, and turned back off.
#
# Class-level parallelism (different classes concurrently, methods within a class sequential)
# was tried here. It's theoretically safe for this suite (the four pure unit-test classes share
# no state, and AdminPanelUiTest/ApiIntegrationTest keep their own methods ordered) — but in
# practice it made Surefire's plain-text console reporter misattribute per-class test counts
# across threads: two consecutive `mvn test` runs printed different, wrong "Tests run: N -- in
# ClassX" numbers for the same classes (e.g. JsonTest showing 21 instead of its real count),
# even though the aggregate total and pass/fail counts stayed correct both times. At ~58 tests
# running in well under a second, the wall-clock win isn't worth console output you can't trust
# at a glance. Left disabled here rather than removed, so re-enabling is a one-line change if the
# suite grows enough that the speed actually matters — see TEST_STRATEGY.md.

junit.jupiter.execution.parallel.enabled = false
